name: 发布监控站点与独立 HTML 镜像
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fjd-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 校验并组装镜像资产
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cloud/pages-mirrors.mjs
      - name: 核实静态工件发布设置
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode=$(gh api repos/$GITHUB_REPOSITORY/pages --jq .build_type)
          if [ "$mode" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages 尚使用分支发布。网站继续沿用旧发布方式；管理员切换 Source 为 GitHub Actions 后才启用独立资产存储。"
          fi
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.ready == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.source.outputs.ready == 'true'
        id: deploy
      - name: 部署成功后回收过期独立资产
        if: steps.source.outputs.ready == 'true' && steps.deploy.conclusion == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cloud/pages-mirrors.mjs --gc
