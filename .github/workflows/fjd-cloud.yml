name: 丰疆云端监控
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '17,37,57 0-1 * * *'
    - cron: '17 2 * * *'
    - cron: '30 2 * * *'
    - cron: '37 2 * * *'
    - cron: '17 6,8 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'check 配置检查；verify 检索归档及群测试；scan 立即检索；sync 归档；digest 每日简报'
        type: choice
        default: scan
        options: [auto, check, verify, scan, site-retry, sync, digest, test-digest, migrate, review]
      payload:
        description: '仅粘贴网页生成的加密传输内容；不要填写密钥、令牌或明文复核资料'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: fjd-cloud-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 准备日报图表
        run: python3 -m pip install --quiet Pillow==11.3.0
      - name: 云端检索、Notion 归档与飞书简报
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MONITOR_CLOUD_PASSWORD: ${{ secrets.MONITOR_CLOUD_PASSWORD }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          FJD_OPERATION: ${{ inputs.operation }}
          FJD_PAYLOAD: ${{ inputs.payload }}
          FJD_SCHEDULE: ${{ github.event.schedule }}
        run: node cloud/runner.mjs
