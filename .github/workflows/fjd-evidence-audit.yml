name: 只读截图证据验收
on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: '1-3 existing stable lead IDs (JSON array)'
        required: true
      recipient_key:
        description: 'Maintenance recipient RSA public key (base64 PEM); never a private key'
        required: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: 只读核验与接收方加密
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_CLOUD_PASSWORD: ${{ secrets.MONITOR_CLOUD_PASSWORD }}
          AUDIT_SOURCE_IDS: ${{ inputs.source_ids }}
          AUDIT_RECIPIENT_KEY: ${{ inputs.recipient_key }}
          AUDIT_SAVE_ENCRYPTED_OUTPUT: '1'
        run: node cloud/evidence-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-evidence-audit
          path: evidence-audit.enc.json
          retention-days: 1
          if-no-files-found: error
