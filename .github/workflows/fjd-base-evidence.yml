name: 飞书线索证据补传
on:
  schedule:
    # Outside the 09:10–09:45 Beijing publication guard; two existing events/run.
    - cron: '20 0,3-23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fjd-cloud-monitor
  queue: max
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth x11-utils libxtst6 python3-tk fonts-noto-cjk
          python3 -m pip install --quiet Pillow==11.3.0 playwright==1.55.0
      - name: 补齐原始初核事件证据并核验附件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_CLOUD_PASSWORD: ${{ secrets.MONITOR_CLOUD_PASSWORD }}
          FEISHU_BASE_REVIEW_WEBHOOK: ${{ secrets.FEISHU_BASE_REVIEW_WEBHOOK }}
          FEISHU_BASE_APP_ID: ${{ secrets.FEISHU_BASE_APP_ID }}
          FEISHU_BASE_APP_SECRET: ${{ secrets.FEISHU_BASE_APP_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FJD_OPERATION: base-evidence
        run: node cloud/runner.mjs
