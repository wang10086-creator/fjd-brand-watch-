name: 补传原浏览器的七次复核记录
on:
  push:
    branches: [main]
    paths: [cloud/review-transfer-request.json]
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: fjd-cloud-monitor
  queue: max
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 校验原密文、去重补传及核对原复核回执
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_CLOUD_PASSWORD: ${{ secrets.MONITOR_CLOUD_PASSWORD }}
          FEISHU_BASE_REVIEW_WEBHOOK: ${{ secrets.FEISHU_BASE_REVIEW_WEBHOOK }}
        run: node cloud/import-review-transfer.mjs
