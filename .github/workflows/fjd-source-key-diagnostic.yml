name: Fixed formal source key diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-source-key-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read fixed October 29 queue without mutations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_CLOUD_PASSWORD: ${{ secrets.MONITOR_CLOUD_PASSWORD }}
        run: node cloud/oct29-queue-diagnostic.mjs
